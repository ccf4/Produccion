name: Generar resumen ejecutivo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar el paquete de Playwright para Python
        run: pip install playwright==1.56.0

      # El binario de Chromium (~150MB) se guarda en caché entre corridas, en
      # vez de descargarlo desde cero cada vez (eso era lo que hacía lenta
      # cada corrida, ya sea instalándolo a mano o bajando la imagen completa
      # de Playwright de Docker). Clave por versión: si el día de mañana se
      # sube la versión de arriba, se genera sola una caché nueva.
      - name: Restaurar Chromium en caché
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-1.56.0

      - name: Descargar Chromium + dependencias de sistema (solo la primera vez)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      # Las dependencias de sistema (apt) no viven dentro de la caché de
      # arriba (viven en la máquina virtual, que es nueva en cada corrida),
      # así que hay que reinstalarlas siempre — pero esto es rápido (solo
      # paquetes de apt, no vuelve a bajar Chromium).
      - name: Reinstalar dependencias de sistema (cuando el binario ya viene de caché)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Generar el reporte (usa index.html/overrides.json/cierres.json ya en el repo)
        run: |
          cp tools/resumen_ejecutivo/gen_resumen_ejecutivo.py .
          cp tools/resumen_ejecutivo/subicon_template.js .
          python gen_resumen_ejecutivo.py

      - name: Publicar PDF y marca de tiempo
        run: |
          mkdir -p resumen_ejecutivo
          mv -f resumen_ejecutivo.pdf resumen_ejecutivo/latest.pdf
          printf '{"generated_at":"%s"}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > resumen_ejecutivo/status.json
          rm -f resumen_ejecutivo.html resumen_ejecutivo_preview.png gen_resumen_ejecutivo.py subicon_template.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resumen_ejecutivo/latest.pdf resumen_ejecutivo/status.json
          git commit -m "Resumen ejecutivo generado automáticamente [skip ci]" || echo "Sin cambios que commitear"
          git push
