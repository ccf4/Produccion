name: Generar resumen ejecutivo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    # Imagen oficial de Playwright: ya trae Chromium y sus dependencias de
    # sistema instaladas, así nos ahorramos el "playwright install --with-deps
    # chromium" de cada corrida (la parte lenta: descargar Chromium + sus
    # librerías de sistema desde cero cada vez). El paquete de Python de
    # Playwright sí hay que instalarlo aparte (ver siguiente paso), pero eso
    # es rápido.
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4

      # La imagen de Playwright ya trae Chromium y sus dependencias de sistema
      # instaladas, pero (a pesar de lo que dice su documentación) NO trae el
      # paquete de Python instalado — hay que instalarlo aparte. Esto es rápido
      # (es un paquete chico, no vuelve a bajar Chromium), así que no reintroduce
      # el problema original de lentitud.
      #
      # IMPORTANTE: la versión del paquete de Python DEBE coincidir exacto con
      # la versión de la imagen (arriba, v1.56.0-noble) — Playwright exige que
      # ambas coincidan. Si en el futuro se sube el tag de la imagen, hay que
      # actualizar este número también (y viceversa).
      - name: Instalar el paquete de Playwright para Python (misma versión que la imagen)
        run: pip install playwright==1.56.0

      - name: Generar el reporte (usa index.html/overrides.json/cierres.json ya en el repo)
        run: |
          cp tools/resumen_ejecutivo/gen_resumen_ejecutivo.py .
          cp tools/resumen_ejecutivo/subicon_template.js .
          python gen_resumen_ejecutivo.py

      - name: Publicar PDF y marca de tiempo
        run: |
          mkdir -p resumen_ejecutivo
          mv -f resumen_ejecutivo.pdf resumen_ejecutivo/latest.pdf
          printf '{"generated_at":"%s"}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > resumen_ejecutivo/status.json
          rm -f resumen_ejecutivo.html resumen_ejecutivo_preview.png gen_resumen_ejecutivo.py subicon_template.js
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resumen_ejecutivo/latest.pdf resumen_ejecutivo/status.json
          git commit -m "Resumen ejecutivo generado automáticamente [skip ci]" || echo "Sin cambios que commitear"
          git push
