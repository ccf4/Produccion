name: Refresh semanal

# Dos formas de correrlo:
#  1) A mano (Actions > Refresh semanal > Run workflow): procesa lo que haya en nuevos/ de matex-inbox.
#     'aplicar' = false solo hace la prueba y genera el reporte; true publica si sale limpio.
#  2) Solo, cada 30 min, si el lector de correo dejó un lote COMPLETO en nuevos/:
#       - marca LISTO   (solo ERP): procesa y publica si sale limpio.
#       - marca REVISAR (trae PROD): corre solo la PRUEBA y deja el reporte; publicar es manual
#         (corre este flujo a mano con aplicar = true cuando el reporte esté bien).
#     Si algo requiere revisión NO publica y NO reintenta: revisas el reporte y lo corres a mano.

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'true = publicar si sale limpio · false = solo prueba (genera el reporte y no toca nada)'
        required: true
        default: 'false'
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-semanal
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: ccf4/matex-inbox, path: inbox, token: '${{ secrets.MATEX_TOKEN }}' }

      - name: Revisar si hay algo que procesar
        id: chk
        run: |
          archivos=$(ls -A inbox/nuevos 2>/dev/null | grep -v -x -e '.gitkeep' -e 'LISTO' -e 'REVISAR' || true)
          hay=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            aplicar=true
            if [ -n "$archivos" ] && [ -f inbox/nuevos/REVISAR ]; then hay=true; aplicar=false
            elif [ -n "$archivos" ] && [ -f inbox/nuevos/LISTO ]; then hay=true; fi
          else
            [ -n "$archivos" ] && hay=true
            aplicar="${{ github.event.inputs.aplicar }}"
          fi
          echo "hay=$hay" >> "$GITHUB_OUTPUT"
          echo "aplicar=$aplicar" >> "$GITHUB_OUTPUT"
          if [ "$hay" = "true" ]; then echo "Archivos a procesar:"; echo "$archivos"; else echo "No hay un lote listo en nuevos/."; echo "No hay un lote listo en nuevos/ de matex-inbox. No se hizo nada." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Consumir la marca (LISTO/REVISAR; evita reintentos si algo requiere revisión)
        if: steps.chk.outputs.hay == 'true'
        run: |
          cd inbox
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch nuevos/LISTO nuevos/REVISAR
          git diff --cached --quiet || { git commit -qm "lote tomado" && git pull -q --rebase && git push; }

      - uses: actions/checkout@v4
        if: steps.chk.outputs.hay == 'true'
        with: { path: prod, token: '${{ secrets.MATEX_TOKEN }}' }
      - uses: actions/checkout@v4
        if: steps.chk.outputs.hay == 'true'
        with: { repository: ccf4/consulta_produccion, path: mtx, token: '${{ secrets.MATEX_TOKEN }}' }

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.hay == 'true'
        with: { python-version: '3.12' }
      - if: steps.chk.outputs.hay == 'true'
        run: pip install openpyxl

      - name: Armar la carpeta de trabajo (archivos nuevos + el último Documentos ya procesado)
        if: steps.chk.outputs.hay == 'true'
        run: |
          mkdir -p work
          cp -r inbox/nuevos/. work/ 2>/dev/null || true
          rm -f work/LISTO work/REVISAR work/.gitkeep
          # Documentos de la semana anterior: los pedidos viejos se resuelven con él
          prev=$(ls -1 inbox/procesados/*DOCUMENTOS* 2>/dev/null | sort | tail -n 1 || true)
          [ -n "$prev" ] && cp "$prev" work/ || true
          # cierres/overrides tal como están ahora (para saber cuáles se hornearon)
          cp prod/cierres.json snap_cierres.json
          cp prod/overrides.json snap_overrides.json
          ls -la work

      - name: Correr refresh.py
        if: steps.chk.outputs.hay == 'true'
        id: run
        continue-on-error: true
        run: |
          python prod/tools/refresh/refresh.py \
            --index prod/index.html --matex mtx/matex.html --historico mtx/historico.json \
            --cierres snap_cierres.json --overrides snap_overrides.json \
            --decisiones prod/tools/refresh/decisiones.json \
            --inbox work --out out | tee salida.txt
          exit ${PIPESTATUS[0]}

      - name: Resumen en la pantalla de la corrida
        if: always() && steps.chk.outputs.hay == 'true'
        run: |
          [ -f out/reporte.md ] && cat out/reporte.md >> "$GITHUB_STEP_SUMMARY" || echo "refresh.py no generó reporte" >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el reporte (siempre, en el repo privado)
        if: always() && steps.chk.outputs.hay == 'true'
        run: |
          [ -f out/reporte.md ] || exit 0
          mkdir -p inbox/reportes
          cp out/reporte.md "inbox/reportes/reporte_$(date -u +%Y%m%d_%H%M).md"
          cd inbox
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reportes && git commit -qm "reporte de refresh" && git pull -q --rebase && git push || true

      - name: Detener si requiere revisión o es solo prueba
        if: steps.chk.outputs.hay == 'true' && (steps.run.outcome != 'success' || steps.chk.outputs.aplicar != 'true')
        run: |
          if [ "${{ steps.run.outcome }}" != "success" ]; then echo "::error::El refresh requiere revisión o falló. No se publicó nada. Revisa el reporte (aquí abajo y en matex-inbox/reportes). Cuando lo resuelvas, corre el flujo a mano."; exit 1; fi
          echo "Modo prueba: no se publicó nada. Si el reporte está bien, corre este flujo a mano con aplicar = true."
          echo "PRUEBA (no se publicó nada). Si el reporte está bien, corre el flujo a mano con aplicar = true." >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar en los dos repos
        if: steps.chk.outputs.hay == 'true' && steps.run.outcome == 'success' && steps.chk.outputs.aplicar == 'true'
        run: |
          set -e
          # Si alguien subió index/matex mientras corría, no pisarlo
          for r in prod mtx; do
            git -C $r fetch -q origin
            [ "$(git -C $r rev-parse HEAD)" = "$(git -C $r rev-parse origin/HEAD)" ] || git -C $r diff --quiet HEAD origin/HEAD -- index.html matex.html historico.json || { echo "::error::$r cambió durante la corrida; vuelve a correr."; exit 1; }
            git -C $r pull -q --rebase
          done
          python prod/tools/refresh/publish.py --out out --prod-repo prod --mtx-repo mtx \
            --snap-cierres snap_cierres.json --snap-overrides snap_overrides.json
          publicar() {   # $1 = carpeta del repo, resto = archivos que le tocan a ese repo
            r=$1; shift
            git -C $r config user.name "github-actions[bot]"; git -C $r config user.email "github-actions[bot]@users.noreply.github.com"
            git -C $r add -A -- "$@"
            git -C $r diff --cached --quiet || { git -C $r commit -m "Refresh semanal $(date -u +%F)"; git -C $r push; }
          }
          publicar prod index.html cierres.json overrides.json
          publicar mtx matex.html historico.json
          # archivos recibidos -> procesados/
          cd inbox
          git pull -q --rebase
          mkdir -p procesados
          # si ya existe un archivo con ese nombre en procesados/ (p. ej. archivo.zip de la semana pasada), se le antepone la fecha
          for f in $(find nuevos -type f ! -name .gitkeep); do
            b=$(basename "$f"); d="procesados/$b"
            [ -e "$d" ] && d="procesados/$(date -u +%Y%m%d_%H%M)_$b"
            git mv "$f" "$d"
          done
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -qm "archivos procesados" && git push
